services:
  - type: web
    name: discharge-explainer-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: development
      - key: DATABASE_URL
        sync: false # Paste your Supabase PostgreSQL connection string
      - key: LLM_PROVIDER
        value: openai_compatible # Allows free hosted inference (e.g. Groq, OpenRouter)
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL_ID
        value: llama-3.1-8b-instant
      - key: TRANSLATION_JUDGE_MODEL_ID
        value: llama-3.1-8b-instant
      - key: TRANSLATION_MODEL_ID
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false # Paste your free Groq API key (gsk_...) or OpenRouter key
      - key: ALLOW_REMOTE_LLM
        value: "true"
      - key: CORS_ORIGINS
        value: "*" # Or set to your Vercel URL: https://your-app.vercel.app
